name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            julia-version: '1.10'
          - os: ubuntu-latest
            julia-version: '1.11'
          - os: ubuntu-latest
            julia-version: '1.12'
          - os: macos-latest
            julia-version: '1.12'
          - os: windows-latest
            julia-version: '1.12'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev mpich

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install netcdf open-mpi

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Instantiate project
        run: julia --project -e 'isfile("Manifest.toml") && rm("Manifest.toml"); using Pkg; Pkg.instantiate()'

      - name: Run tests
        env:
          JULIA_DEPOT_PATH: ~/.julia
        run: julia --project -e 'using Pkg; Pkg.test(; coverage=true)'

      - name: Process coverage
        if: matrix.julia-version == '1.11' && runner.os == 'Linux'
        uses: julia-actions/julia-processcoverage@v1

      - name: Upload coverage to Codecov
        if: matrix.julia-version == '1.11' && runner.os == 'Linux'
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Multi-rank + multi-thread deadlock guard. The single-process `test` job
  # cannot exercise it: the regression test in `test/mpi_threaded_step_smoke.jl`
  # only bites under >=2 MPI ranks each with >=2 Julia threads. Linux/MPICH so
  # MPIEXEC_TIMEOUT bounds a hang into a non-zero exit; timeout-minutes is a
  # hard backstop if that ever fails to fire.
  mpi-deadlock-guard:
    name: MPI threaded-step deadlock guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev mpich

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Instantiate project
        run: julia --project -e 'isfile("Manifest.toml") && rm("Manifest.toml"); using Pkg; Pkg.instantiate()'

      - name: Multi-rank threaded smoke test
        env:
          MPIEXEC_TIMEOUT: '300'
          NRANKS: '2'
          NTHREADS: '2'
        run: bash test/run_mpi_threaded_smoke.sh

      - name: Multi-rank distributed write round-trip
        env:
          MPIEXEC_TIMEOUT: '300'
          NRANKS: '2'
        run: bash test/run_mpi_write_roundtrip_smoke.sh
