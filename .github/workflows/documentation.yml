name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

concurrency:
  # All gh-pages deploys (main push + every tag push) share ONE group so they
  # serialize instead of racing the gh-pages push (a per-ref group let a tag
  # build and a main build deploy at once -> non-fast-forward rejection). PRs
  # keep a per-ref group and cancel stale runs.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    permissions:
      actions: write
      contents: write
      statuses: write
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for Documenter.jl to detect tags

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnetcdf-dev mpich

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'

      - name: Cache Julia artifacts
        uses: julia-actions/cache@v3

      - name: Install package dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Install documentation dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.develop(path="."); Pkg.instantiate()'

      - name: Build and deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # DOCUMENTER_KEY is optional for public repos, GITHUB_TOKEN is sufficient
        run: |
          julia --project=docs -e '
            using Documenter: doctest
            using GeoDynamo
            # doctest(GeoDynamo)  # Skip doctests for now
          '
          julia --project=docs docs/make.jl
